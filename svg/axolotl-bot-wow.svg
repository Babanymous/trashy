<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" class="ax s-wow" viewBox="0 30 400 340" width="400" height="340" role="img" aria-label="Axolotl creature mascot">
<title>Axolotl</title>
<style>
.ax{--hd1:#3f5f1b;--hd2:#1b2c0c;--hd3:#0b1505;--ln:#c9ef5d;--sc:#e9fb6e;--pa:#ff3d7f;--pb:#3a63ff;--bl:#ff6f9f;overflow:visible}
.ax .ly,.ax .ax-dec{opacity:0}
.ax.s-idle .l-idle,.ax.s-joy .l-joy,.ax.s-love .l-love,.ax.s-cool .l-cool,.ax.s-wow .l-wow,
.ax.s-angry .l-angry,.ax.s-loading .l-loading,.ax.s-sleep .l-sleep{opacity:1}
.ax.s-love .d-h,.ax.s-sleep .d-z,.ax.s-angry .d-a,.ax.s-joy .d-s{opacity:1}
.ax-bl{opacity:.4}.ax.s-joy .ax-bl,.ax.s-love .ax-bl{opacity:.85}.ax.s-angry .ax-bl{opacity:.15}.ax.s-sleep .ax-bl{opacity:.6}
.ax-float,.ax-turn,.ax-sq{transform-origin:200px 318px}
.ax-look{transform-origin:200px 190px}
.ax-tl{transform-origin:246px 282px}
.ax-sh,.ax-bk,.ax-hp,.ax-dil,.ax-mo{transform-box:fill-box;transform-origin:center}
.ax-face{transition:transform .2s ease-out;transform:translate(var(--lx,0px),var(--ly,0px))}
.ax-pf{transition:transform .12s ease-out;transform:translate(var(--px,0px),var(--py,0px))}
.ax-g{animation:ax-sw var(--sd,4.6s) ease-in-out infinite}
.ax-g2{animation-delay:-1.2s}.ax-g3{animation-delay:-2.4s}.ax-r1{animation-delay:-.5s}.ax-r2{animation-delay:-1.7s}.ax-r3{animation-delay:-2.9s}
.ax-tl{animation:ax-wag var(--td,3.2s) ease-in-out infinite}
.ax.s-joy{--sd:.8s;--sa:14;--td:.8s}.ax.s-love{--sd:2.2s;--sa:9}.ax.s-wow{--sd:1.4s;--sa:10;--td:1.4s}
.ax.s-angry{--sd:.26s;--sa:5;--td:.5s}.ax.s-loading{--sd:2.4s;--td:2.4s}.ax.s-sleep{--sd:6s;--sa:2.5;--td:6s}.ax.s-cool{--sd:5.5s;--td:4s}

.ax.s-idle .ax-float{animation:ax-bob 4.6s ease-in-out infinite}
.ax.s-idle .ax-sh{animation:ax-sh 4.6s ease-in-out infinite}
.ax.s-idle .ax-sq{animation:ax-br 4.6s ease-in-out -.6s infinite}
.ax.s-idle .ax-turn{animation:ax-turn 12s ease-in-out infinite}
.ax.s-idle .ax-look{animation:ax-look 12s ease-in-out infinite}
.ax.s-idle .ax-pl{animation:ax-pl 12s ease-in-out infinite}
.ax.s-idle .ax-bk{animation:ax-blink 6s infinite}
.ax.follow .ax-look,.ax.follow .ax-turn,.ax.follow .ax-pl{animation:none}

.ax.s-cool .ax-float{animation:ax-bob 5.5s ease-in-out infinite}
.ax.s-cool .ax-sh{animation:ax-sh 5.5s ease-in-out infinite}
.ax.s-cool .ax-turn{animation:ax-lean 5.5s ease-in-out infinite}
.ax.s-cool .ax-pl{animation:ax-side 5.5s ease-in-out infinite}

.ax.s-love .ax-float{animation:ax-bob 3.6s ease-in-out infinite}
.ax.s-love .ax-sh{animation:ax-sh 3.6s ease-in-out infinite}
.ax.s-love .ax-turn{animation:ax-sway 3.6s ease-in-out infinite}
.ax.s-love .ax-sq{animation:ax-beat 1.1s ease-in-out infinite}
.ax.s-love .ax-hp{animation:ax-hp 1.1s ease-in-out infinite}

.ax.s-joy .ax-float{animation:ax-hop .8s infinite}
.ax.s-joy .ax-sh{animation:ax-shhop .8s infinite}
.ax.s-joy .ax-sq{animation:ax-jsq .8s ease-in-out infinite}

.ax.s-wow .ax-float{animation:ax-jump 1.6s infinite}
.ax.s-wow .ax-sh{animation:ax-shj 1.6s infinite}
.ax.s-wow .ax-sq{animation:ax-wsq 1.6s ease-in-out infinite}
.ax.s-wow .ax-dil{animation:ax-dil 1.6s ease-in-out infinite}
.ax.s-wow .ax-mo{animation:ax-mo 1.6s ease-in-out infinite}

.ax.s-angry .ax-float{animation:ax-knock .26s ease-in-out infinite}
.ax.s-angry .ax-sq{animation:ax-puff .52s ease-in-out infinite}

.ax.s-loading .ax-float{animation:ax-bob 2.4s ease-in-out infinite}
.ax.s-loading .ax-sh{animation:ax-sh 2.4s ease-in-out infinite}
.ax.s-loading .ax-sq{animation:ax-br 2.4s ease-in-out infinite}
.ax.s-loading .ax-turn{animation:ax-tilt 2.4s ease-in-out infinite}
.ax.s-loading .ax-orb{animation:ax-orb 1.2s linear infinite}
.ax.s-loading .ax-orb.o2{animation-delay:-.15s}

.ax.s-sleep .ax-sq{animation:ax-sl 5s ease-in-out infinite}
.ax.s-sleep .ax-sh{animation:ax-sh 5s ease-in-out infinite}
.ax.s-sleep .ax-turn{animation:ax-nod 5s ease-in-out infinite}
.ax.s-sleep .ax-mo{animation:ax-snore 5s ease-in-out infinite}

.ax-h{animation:ax-rise 2.8s ease-out infinite}.ax-h2{animation-delay:-1.3s}.ax-h3{animation-delay:-.6s}
.ax-z{animation:ax-zz 3.4s ease-out infinite}.ax-z2{animation-delay:-1.7s}
.ax-st{animation:ax-steam .9s ease-out infinite}.ax-st2{animation-delay:-.45s}
.ax-sp{transform-box:fill-box;transform-origin:center;animation:ax-spark .8s ease-out infinite}.ax-sp2{animation-delay:-.4s}

@keyframes ax-bob{0%,100%{transform:translateY(0) rotate(-.8deg)}45%{transform:translateY(-12px) rotate(.4deg)}60%{transform:translateY(-11px) rotate(1deg)}}
@keyframes ax-br{0%,100%{transform:scale(1.025,.975)}50%{transform:scale(.985,1.025)}}
@keyframes ax-sh{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(.8,.72);opacity:.5}}
@keyframes ax-sw{0%,100%{transform:rotate(calc(var(--sa,7)*-1deg)) scale(1)}50%{transform:rotate(calc(var(--sa,7)*1deg)) scale(1.05,.95)}}
@keyframes ax-wag{0%,100%{transform:rotate(-7deg)}50%{transform:rotate(9deg)}}
@keyframes ax-blink{0%,46%,50%,84%,87%,90%,93%,100%{transform:scaleY(1)}48%,85.5%,91.5%{transform:scaleY(.06)}}
@keyframes ax-look{0%,10%,36%,46%,86%,100%{transform:translate(0,0)}16%,30%{transform:translate(-6px,0)}52%,66%{transform:translate(6px,-3px)}72%,80%{transform:translate(2px,4px)}}
@keyframes ax-pl{0%,10%,36%,46%,86%,100%{transform:translate(0,0)}14%,32%{transform:translate(-11px,1px)}50%,68%{transform:translate(10px,-6px)}72%,82%{transform:translate(1px,7px)}}
@keyframes ax-turn{0%,10%,36%,46%,86%,100%{transform:rotate(0)}16%,30%{transform:rotate(-3deg)}52%,66%{transform:rotate(3deg)}72%,80%{transform:rotate(.8deg)}}
@keyframes ax-lean{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(-1.5deg) translateX(3px)}}
@keyframes ax-side{0%,40%,100%{transform:translate(9px,0)}55%,85%{transform:translate(-4px,1px)}}
@keyframes ax-sway{0%,100%{transform:rotate(-3.5deg)}50%{transform:rotate(3.5deg)}}
@keyframes ax-tilt{0%,100%{transform:rotate(-2deg)}50%{transform:rotate(4deg)}}
@keyframes ax-hop{0%{transform:translateY(0) rotate(0);animation-timing-function:cubic-bezier(.2,.7,.3,1)}45%{transform:translateY(-34px) rotate(-5deg);animation-timing-function:cubic-bezier(.6,0,.9,.4)}70%{transform:translateY(-24px) rotate(4deg)}90%,100%{transform:translateY(0) rotate(0)}}
@keyframes ax-jsq{0%,100%{transform:scale(1.12,.86)}12%{transform:scale(.92,1.12)}45%{transform:scale(.98,1.03)}78%{transform:scale(.95,1.07)}92%{transform:scale(1.14,.84)}}
@keyframes ax-shhop{0%,90%,100%{transform:scale(1);opacity:1}45%{transform:scale(.55,.5);opacity:.4}}
@keyframes ax-beat{0%,40%,100%{transform:scale(1)}10%{transform:scale(1.06,.96)}20%{transform:scale(.99,1.02)}30%{transform:scale(1.04,.98)}}
@keyframes ax-hp{0%,40%,100%{transform:scale(1)}10%{transform:scale(1.22)}20%{transform:scale(.96)}30%{transform:scale(1.14)}}
@keyframes ax-jump{0%,100%{transform:translateY(0)}8%{transform:translateY(4px)}22%{transform:translateY(-22px) rotate(-2deg)}38%{transform:translateY(0) rotate(1deg)}46%{transform:translateY(-5px)}54%{transform:translateY(0)}}
@keyframes ax-shj{0%,54%,100%{transform:scale(1);opacity:1}22%{transform:scale(.7,.62);opacity:.45}}
@keyframes ax-wsq{0%,54%,100%{transform:scale(1)}8%{transform:scale(1.1,.9)}22%{transform:scale(.93,1.1)}38%{transform:scale(1.06,.95)}}
@keyframes ax-dil{0%,100%{transform:scale(1)}20%,30%{transform:scale(.55)}60%{transform:scale(1.1)}}
@keyframes ax-mo{0%,100%{transform:scale(1)}20%,40%{transform:scale(1.25,1.35)}}
@keyframes ax-knock{0%,100%{transform:translate(-3.5px,1px) rotate(-2deg)}50%{transform:translate(3.5px,-1px) rotate(2deg)}}
@keyframes ax-puff{0%,100%{transform:scale(1)}50%{transform:scale(1.04,1.02)}}
@keyframes ax-orb{to{transform:rotate(360deg)}}
@keyframes ax-sl{0%,100%{transform:scale(1)}50%{transform:scale(1.05,.95)}}
@keyframes ax-nod{0%,100%{transform:rotate(-5deg)}50%{transform:rotate(.5deg)}}
@keyframes ax-snore{0%,100%{transform:scale(.7)}50%{transform:scale(1.25)}}
@keyframes ax-rise{0%{transform:translate(0,0) scale(.3);opacity:0}20%{opacity:.95}100%{transform:translate(-20px,-84px) scale(1);opacity:0}}
@keyframes ax-zz{0%{transform:translate(0,0) scale(.4);opacity:0}25%{opacity:.9}100%{transform:translate(24px,-66px) scale(1);opacity:0}}
@keyframes ax-steam{0%{transform:translate(0,0) scale(.5);opacity:0}30%{opacity:.9}100%{transform:translate(6px,-30px) scale(1.2);opacity:0}}
@keyframes ax-spark{0%{transform:scale(.2) rotate(0);opacity:0}40%{opacity:1}100%{transform:scale(1.1) rotate(90deg);opacity:0}}
@media (prefers-reduced-motion:reduce){.ax *{animation:none!important}}
</style>
